<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonne fête Zoé !</title>
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    color:#2b2420;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#f7f5f2;
  }
  main{width:100%;max-width:1200px;padding:40px 20px;text-align:center}
  h1{font-size:clamp(2rem,6vw,3rem);font-weight:600;margin:0 0 32px}
  .row{display:grid;grid-template-columns:1fr 2fr 1fr;gap:24px;align-items:center}
  .photo{width:100%;display:block;border:8px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .left{transform:rotate(-2deg)}
  .right{transform:rotate(2deg)}
  video{width:100%;max-height:75vh;background:#000;border-radius:6px;display:block}
  .missing{border:1px dashed #b3a58f;border-radius:6px;padding:80px 20px;color:#8a7c68;background:rgba(255,255,255,.5)}
  @media (max-width:760px){
    .row{grid-template-columns:1fr 1fr}
    .center{grid-column:1 / -1;grid-row:1}
  }
</style>
</head>
<body>
<main>
  <h1>Bonne fête Zoé !</h1>
  <div class="row">
    <img class="photo left" src="photo1.jpg" alt="Au café">
    <div class="center" id="vbox">
      <video id="vid" controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>
    <img class="photo right" src="photo2.jpg" alt="Dans la rue">
  </div>
</main>
<script>
  var v=document.getElementById('vid');
  function missing(){document.getElementById('vbox').innerHTML='<div class="missing">La vidéo arrive bientôt.</div>';}
  v.querySelector('source').addEventListener('error',missing);
  v.addEventListener('error',missing);
</script>
</body>
</html>
